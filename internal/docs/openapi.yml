openapi: 3.0.3
info:
  title: Hotel Booking API
  version: 0.1.0
servers:
  - url: / # same host and port that served this page, so Swagger never calls a different origin
paths:
  /healthcheck:
    get:
      summary: Check the API is reachable
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok }
        "503":
          description: system unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: unavailable }
  /v1/hotels:
    get:
      summary: Find hotels by name
      description: Case-insensitive search on part of the name. Surrounding spaces are ignored.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, example: grand }
      responses:
        "200":
          description: Matching hotels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /v1/hotels/{hotelId}/rooms/available:
    get:
      summary: List rooms free for the whole stay
      description: >
        Returns the rooms of a hotel that can hold the given number of guests
        and have no booking overlapping the stay. The stay is half-open, so a
        guest may check in on the day another guest checks out.
      parameters:
        - name: hotelId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1, example: 1 }
        - name: check_in
          in: query
          required: true
          description: First night of the stay. Must not be in the past.
          schema: { type: string, format: date, example: "2030-01-10" }
        - name: check_out
          in: query
          required: true
          description: Day of departure. Must be after check_in, at most 30 nights later.
          schema: { type: string, format: date, example: "2030-01-12" }
        - name: guests
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 10, example: 2 }
      responses:
        "200":
          description: Available rooms (the list is empty when none are free)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableRooms" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /v1/bookings:
    post:
      summary: Book a room
      description: >
        Books one room for the whole stay. The API refuses overlapping
        stays, so two guests can never get the same room on the same night.
        The Idempotency-Key header is required, which makes retries safe:
        repeating the same request returns the first booking.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Any unique text, at most 255 characters. Use a new one for each new booking.
          schema: { type: string, maxLength: 255, example: 6b1f0c2e-booking-1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingRequest" }
      responses:
        "201":
          description: Booking created
          headers:
            Location:
              description: Where to read the booking
              schema: { type: string, example: /v1/bookings/CX6N4GSN }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "200":
          description: The Idempotency-Key was used before with the same request, so this is the first booking, unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The room is already booked for part of that stay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Request body is larger than 1 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: More guests than the room holds, or the Idempotency-Key was used for a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
  /v1/bookings/{reference}:
    get:
      summary: Look up a booking by its reference
      description: The reference is not case sensitive and surrounding spaces are ignored.
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, example: CX6N4GSN }
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
components:
  responses:
    BadRequest:
      description: Invalid or missing input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Nothing found for the given input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Unexpected error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    BookingRequest:
      type: object
      required: [hotel_id, room_id, guest_name, guest_email, check_in, check_out, guests]
      properties:
        hotel_id: { type: integer, format: int64, minimum: 1, example: 1 }
        room_id: { type: integer, format: int64, minimum: 1, example: 3 }
        guest_name: { type: string, minLength: 1, maxLength: 100, example: Jane Doe }
        guest_email: { type: string, format: email, maxLength: 254, example: jane@example.com }
        check_in: { type: string, format: date, description: "Must not be in the past", example: "2031-03-10" }
        check_out: { type: string, format: date, description: "After check_in, at most 30 nights later", example: "2031-03-12" }
        guests: { type: integer, minimum: 1, maximum: 10, description: "At most the room capacity", example: 2 }
    Booking:
      type: object
      properties:
        reference: { type: string, description: "8 characters", example: CX6N4GSN }
        hotel_id: { type: integer, format: int64, example: 1 }
        room: { $ref: "#/components/schemas/Room" }
        guest_name: { type: string, example: Jane Doe }
        guest_email: { type: string, format: email, example: jane@example.com }
        check_in: { type: string, format: date, example: "2031-03-10" }
        check_out: { type: string, format: date, example: "2031-03-12" }
        nights: { type: integer, example: 2 }
        guests: { type: integer, example: 2 }
        created_at: { type: string, format: date-time, example: "2031-03-01T09:30:00Z" }
    Room:
      type: object
      properties:
        id: { type: integer, format: int64, example: 3 }
        number: { type: string, example: "201" }
        type: { type: string, enum: [single, double, deluxe], example: double }
        capacity: { type: integer, example: 2 }
    AvailableRooms:
      type: object
      properties:
        hotel_id: { type: integer, format: int64, example: 1 }
        check_in: { type: string, format: date, example: "2030-01-10" }
        check_out: { type: string, format: date, example: "2030-01-12" }
        nights: { type: integer, example: 2 }
        guests: { type: integer, example: 2 }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable] }
    Hotel:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Grand Palace Hotel }
    HotelList:
      type: object
      properties:
        hotels:
          type: array
          items: { $ref: "#/components/schemas/Hotel" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [invalid_input, not_found, method_not_allowed, payload_too_large, room_unavailable, over_capacity, idempotency_mismatch, internal_error]
              example: invalid_input
            message: { type: string }
