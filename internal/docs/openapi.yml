openapi: 3.0.3
info:
  title: Hotel Booking API
  version: 0.1.0
servers:
  - url: / # same host and port that served this page, so Swagger never calls a different origin
paths:
  /healthcheck:
    get:
      summary: Check the API and database are reachable
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: unavailable }
  /v1/hotels:
    get:
      summary: Find hotels by name
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Matching hotels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelList" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/hotels/{hotelId}/rooms/available:
    get:
      summary: List rooms free for the whole stay
      description: >
        Returns the rooms of a hotel that can hold the given number of guests
        and have no booking overlapping the stay. The stay is half-open, so a
        guest may check in on the day another guest checks out.
      parameters:
        - name: hotelId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1, example: 1 }
        - name: check_in
          in: query
          required: true
          description: First night of the stay. Must not be in the past.
          schema: { type: string, format: date, example: "2030-01-10" }
        - name: check_out
          in: query
          required: true
          description: Day of departure. Must be after check_in, at most 30 nights later.
          schema: { type: string, format: date, example: "2030-01-12" }
        - name: guests
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 10, example: 2 }
      responses:
        "200":
          description: Available rooms (the list is empty when none are free)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableRooms" }
        "400":
          description: Invalid hotelId, dates or guests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No hotel with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/bookings/{reference}:
    get:
      summary: Look up a booking by its reference
      description: >
        The reference is not case sensitive and surrounding spaces are ignored,
        so bk-0001 finds BK-0001.
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, example: BK-0001 }
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404":
          description: No booking with that reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Booking:
      type: object
      properties:
        reference: { type: string, example: BK-0001 }
        hotel_id: { type: integer, format: int64, example: 1 }
        room: { $ref: "#/components/schemas/Room" }
        guest_name: { type: string, example: John Smith }
        guest_email: { type: string, format: email, example: john@example.com }
        check_in: { type: string, format: date, example: "2026-11-05" }
        check_out: { type: string, format: date, example: "2026-11-08" }
        nights: { type: integer, example: 3 }
        guests: { type: integer, example: 1 }
        created_at: { type: string, format: date-time, example: "2026-11-04T09:30:00Z" }
    Room:
      type: object
      properties:
        id: { type: integer, format: int64, example: 3 }
        number: { type: string, example: "201" }
        type: { type: string, enum: [single, double, deluxe], example: double }
        capacity: { type: integer, example: 2 }
    AvailableRooms:
      type: object
      properties:
        hotel_id: { type: integer, format: int64, example: 1 }
        check_in: { type: string, format: date, example: "2030-01-10" }
        check_out: { type: string, format: date, example: "2030-01-12" }
        nights: { type: integer, example: 2 }
        guests: { type: integer, example: 2 }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable] }
    Hotel:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Grand Palace Hotel }
    HotelList:
      type: object
      properties:
        hotels:
          type: array
          items: { $ref: "#/components/schemas/Hotel" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: invalid_input }
            message: { type: string }
